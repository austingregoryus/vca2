# SPDX-License-Identifier: MIT
# Ubuntu 24.04 LTS "noble" -- EXPECTED TO FAIL. Kept so the reasoning is
# recorded and so anyone who wants to prove it either way has a starting point.
#
# noble ships systemd 255. systemd dropped support for kernels older than 4.15
# in v254 (NEWS: "systemd now requires a kernel >= 4.15"), and this card is
# permanently on Intel's 4.14.20 -- the kernel cannot be changed without
# porting the out-of-tree vcablk block driver off the legacy request API
# (blk_init_queue, alloc_disk, genhd.h), which is what actually mounts the
# root filesystem. See docs/NODE_IMAGE.md.
#
# The likely failure mode is a node that boots into the initramfs, switch_roots
# and then sits there with no console and no network -- i.e. indistinguishable
# from a hang, and diagnosable only by mounting the image afterwards and
# reading /var/log/vca-netcfg.log. Budget time accordingly.
#
# SUPPORT=expected-broken forces --force-support to build.

DISTRO=ubuntu
SUITE=noble
SUPPORT=expected-broken
DESCRIPTION="Ubuntu 24.04 LTS - systemd 255 requires kernel >= 4.15. This card is 4.14."

MIRROR=http://archive.ubuntu.com/ubuntu/
COMPONENTS="main restricted universe multiverse"
SECURITY_MIRROR=http://archive.ubuntu.com/ubuntu/
SECURITY_SUITE=noble-security
UPDATES_SUITE=noble-updates
KEYRING=/usr/share/keyrings/ubuntu-archive-keyring.gpg

PKGS_BASE="systemd,systemd-sysv,dbus,udev,kmod,iproute2,iputils-ping,net-tools,openssh-server,ca-certificates,locales,less,vim-tiny,nano,file,pciutils,usbutils,python3,sudo,rsync,curl,wget,gnupg"

PKGS_TOOLCHAIN="build-essential pkg-config git cmake make bc kmod lm-sensors libelf-dev libssl-dev iperf3"

PKGS_OPENCL="ocl-icd-libopencl1 ocl-icd-opencl-dev opencl-headers clinfo"
PKGS_OPENCL_RUNTIME="intel-opencl-icd"

PKGS_MEDIA="intel-media-va-driver-non-free libva-drm2 libva2 vainfo ffmpeg"
PKGS_MEDIA_FALLBACK="va-driver-all vainfo ffmpeg"
