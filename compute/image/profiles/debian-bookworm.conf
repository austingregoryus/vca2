# SPDX-License-Identifier: MIT
# Debian 12 "bookworm".
#
# systemd 252, gcc 12, glibc 2.36. Under the 4.15 line systemd drew in v254,
# so it is the newest *Debian* that should be safe on this kernel -- and it is
# the natural choice if you want a smaller, less opinionated rootfs than
# Ubuntu's.
#
# Two real differences from the Ubuntu profiles, both handled by the builder:
#   - security lives on a different HOST (security.debian.org) and uses the
#     suite name "bookworm-security", not "-security" appended to a mirror
#     path. Ubuntu serves everything from one host.
#   - non-free firmware moved to its own component in bookworm, so the
#     components list is "main contrib non-free non-free-firmware".
#
# intel-opencl-icd is NOT in Debian 12 main; the profile lets it fail and
# fall back to Intel's 2018 NEO blob under /opt/intel-legacy, which is the
# proven Gen9 path here anyway.
#
# SUPPORT=untested: complete, plausible, never built on this hardware.

DISTRO=debian
SUITE=bookworm
SUPPORT=untested
DESCRIPTION="Debian 12 - gcc 12, glibc 2.36, systemd 252. Leaner than Ubuntu."

MIRROR=http://deb.debian.org/debian/
COMPONENTS="main contrib non-free non-free-firmware"
SECURITY_MIRROR=http://security.debian.org/debian-security/
SECURITY_SUITE=bookworm-security
UPDATES_SUITE=bookworm-updates
KEYRING=/usr/share/keyrings/debian-archive-keyring.gpg

PKGS_BASE="systemd,systemd-sysv,dbus,udev,kmod,iproute2,iputils-ping,net-tools,openssh-server,ca-certificates,locales,less,vim-tiny,nano,file,pciutils,usbutils,python3,sudo,rsync,curl,wget,gnupg"

PKGS_TOOLCHAIN="build-essential pkg-config git cmake make bc kmod lm-sensors libelf-dev libssl-dev iperf3"

PKGS_OPENCL="ocl-icd-libopencl1 ocl-icd-opencl-dev opencl-headers clinfo"
# Not in Debian main. Expected to fail -> /opt/intel-legacy fallback.
PKGS_OPENCL_RUNTIME="intel-opencl-icd"

PKGS_MEDIA="intel-media-va-driver-non-free libva-drm2 libva2 vainfo ffmpeg"
PKGS_MEDIA_FALLBACK="va-driver-all vainfo ffmpeg"
