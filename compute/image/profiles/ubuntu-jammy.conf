# SPDX-License-Identifier: MIT
# Ubuntu 22.04 LTS "jammy" -- the reference profile.
#
# SUPPORT=proven means: built, booted and benchmarked on this hardware. See
# docs/NODE_IMAGE.md for the measured A/B against the stock 16.04 image.

DISTRO=ubuntu
SUITE=jammy
SUPPORT=proven
DESCRIPTION="Ubuntu 22.04 LTS - gcc 11, glibc 2.35, systemd 249. The proven target."

MIRROR=http://archive.ubuntu.com/ubuntu/
COMPONENTS="main restricted universe multiverse"
# Ubuntu serves security from the same host, suite-security.
SECURITY_MIRROR=http://archive.ubuntu.com/ubuntu/
SECURITY_SUITE=jammy-security
UPDATES_SUITE=jammy-updates
KEYRING=/usr/share/keyrings/ubuntu-archive-keyring.gpg

# Packages pulled in by debootstrap itself. Keep this minimal -- anything that
# can fail should be in a group below, where a failure is survivable.
PKGS_BASE="systemd,systemd-sysv,dbus,udev,kmod,iproute2,iputils-ping,net-tools,openssh-server,ca-certificates,locales,less,vim-tiny,nano,file,pciutils,usbutils,python3,sudo,rsync,curl,wget,gnupg"

# gcc 11 => C++17/20 natively; this is what removes the need to cross-compile
# llama.cpp with Zig against glibc 2.23.
#
# libelf-dev is NOT optional: this kernel is CONFIG_UNWINDER_ORC=y, so objtool
# runs on every object and needs libelf. Without it every out-of-tree module
# build dies at "Cannot generate ORC metadata" before compiling a line.
PKGS_TOOLCHAIN="build-essential pkg-config git cmake make bc kmod lm-sensors libelf-dev libssl-dev iperf3"

# An ICD LOADER is what the stock image lacks -- it ships Intel's 2018 NEO
# driver but nothing that can call it.
PKGS_OPENCL="ocl-icd-libopencl1 ocl-icd-opencl-dev opencl-headers clinfo"
PKGS_OPENCL_RUNTIME="intel-opencl-icd"

PKGS_MEDIA="intel-media-va-driver-non-free libva-drm2 libva2 vainfo ffmpeg"
PKGS_MEDIA_FALLBACK="i965-va-driver vainfo ffmpeg"
